name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - name: Install JuliaFormatter
        run: julia -e 'import Pkg; Pkg.add("JuliaFormatter")'
      - name: Check formatting
        run: julia -m JuliaFormatter --check -v src/

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker build \
            --build-arg DOMAIN=${{ vars.DOMAIN }} \
            --build-arg NGINX_PORT=${{ vars.NGINX_PORT }} \
            --build-arg JULIA_PORT=${{ vars.JULIA_PORT }} \
            --build-arg SSL_CERT=${{ vars.SSL_CERT }} \
            --build-arg SSL_KEY=${{ vars.SSL_KEY }} \
            -t synapsebonito:latest .
      - name: Smoke test
        run: |
          docker run -d --name synapsebonito -p 8080:80 synapsebonito:latest
          sleep 10
          curl -sf http://localhost:8080/ > /dev/null && echo "OK" || echo "FAIL"
          docker stop synapsebonito
