name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/julia-format@v3
        with:
          version: '2'

  build:
    name: Build Docker image and check startup
    runs-on: ubuntu-latest
    needs: format
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker compose build

      - name: Start application
        run: docker compose up -d --no-build

      - name: Wait for application
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 30 \
            --retry-delay 5 \
            --retry-connrefused \
            --retry-max-time 300 \
            --max-time 30 \
            http://localhost:8081/ \
            --output /tmp/synapsebonito.html

          test -s /tmp/synapsebonito.html

      - name: Show application logs
        if: always()
        run: docker compose logs --no-color --tail 200

      - name: Stop application
        if: always()
        run: docker compose down